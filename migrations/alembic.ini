; Bridge control-plane migrations. Database URL comes from BRIDGE_DATABASE_URL (never stored here).
; Run from repo root:  services/control-api/.venv/Scripts/python -m alembic -c migrations/alembic.ini upgrade head
[alembic]
path_separator = os
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
